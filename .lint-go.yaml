# This project's carve-outs from the Go lint baseline (.limen/lint-go.yaml):
# the baseline's sections, in its shape, holding only what this project adds,
# changes or takes out. `just do lint go` renders the two on every run
# (book/linting-go.md, "one baseline, per-project carve-outs").

golangci:
  linters:
    exclusions:
      rules:
        # The examples open a bridge and a controller on a network: there is
        # no output of theirs a test run could check.
        - path: example_test\.go
          linters:
            - testableexamples
        # The vocabulary is its types: a capability, a change and what a
        # test device was asked are each a struct of a field or two, and
        # there are as many as a home's devices have things to say. A count
        # of them measures the vocabulary, not a package doing too much.
        - path: ^(matter|source|mattertest/mattertest)\.go$
          text: max-public-structs
    settings:
      depguard:
        rules:
          main:
            # The implementation of Matter this module is built on, named
            # in internal/fabric alone; and the two libraries the sibling
            # modules read and write files with.
            allow:
              - github.com/SukramJ/go-fabric
              - github.com/forkcloser/xos
              - github.com/mycophonic/primordium
      varnamelen:
        # The API's own words for a device's ID and for on or off, kept
        # where the API's functions are implemented.
        ignore-decls:
          - id ID
          - on bool
      wrapcheck:
        # internal/fabric wraps every error of the library underneath with
        # what it was doing; bridge and controller pass it on as it is.
        ignore-package-globs:
          - github.com/duncanite/go-matter/internal/fabric
        # What a Home's Put and Report return is package matter's own error,
        # wrapped there with what it was about; a caller in this module
        # wrapping it again would say the same thing twice. A device's
        # command and a Source's Watch return someone else's error, and are
        # not here.
        extra-ignore-sigs:
          - github.com/duncanite/go-matter.Home).Put(
          - github.com/duncanite/go-matter.Home).Report(

licenses:
  # filippo.io/nistec/internal/fiat is code generated by fiat-crypto, whose
  # license its README carries: the BSD 1-Clause License, word for word
  # (SPDX BSD-1-Clause), which is BSD-2-Clause less its second clause, and
  # the baseline accepts that one whole. The checker reports it under the
  # name of another text of the same words, uthash's. It comes with the
  # implementation of Matter underneath, for the elliptic curve of its
  # handshakes.
  ignore:
    - filippo.io/nistec/internal/fiat
